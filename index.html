<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#1d4ed8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>KASIRAPP</title>
  
  <link rel="icon" href="https://myhartono.com/en/gm-label-small-117-kasir-kasir/?srsltid=AfmBOorSNO90MnZtwak3JAgFAEb4_oY-QXBkb_eOCC4uwfDWWknXe9Aq" />
  
  <!-- KUNCI PERBAIKAN: Memanggil file manifest.json fisik, bukan script inline -->
  <link rel="manifest" href="manifest.json" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #eee;
      overflow: hidden; /* Mencegah scroll ganda */
      font-family: sans-serif;
    }

    .iframe-container {
      width: 100%;
      height: 100dvh; /* Menggunakan dvh agar pas di mobile browser */
      overflow: hidden;
      position: relative;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
    }

    .loading-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #888;
      font-weight: bold;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <div class="loading-text">Menyiapkan Aplikasi...</div>
    
    <!-- Iframe dengan izin mutlak Lintas Domain (*) untuk Bluetooth -->
    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbwyLbVTHCjt_vV1AsPzmkSz6KCayHdYFlQuoVrLMkOeSWlqa9xhe6PwZZ7A96UwJkV5_Q/exec"
      scrolling="yes"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      allow="bluetooth *; fullscreen *; camera *; microphone *; display-capture *; geolocation *;">
    </iframe>
  </div>
</body>
</html>
